[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools]
packages = ["file_explorer_agent"]
package-dir = {"file_explorer_agent" = "src"}

[project]
name = "file-explorer-agent"
version = "1.0.0"
description = "NAT-based ReAct agent that inspects document format at runtime and formulates its own grep strategy"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "nvidia-nat==1.4.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.10.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.entry-points."nat.plugins"]
file_explorer_agent = "file_explorer_agent.register"
